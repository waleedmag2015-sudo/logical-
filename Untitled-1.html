<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<style>
  body {

    display: flex;

  body::before {
    content: "";
    position: fixed;

   }

#btn{

   transform: 0.3s;
    width: 80%;
    font-weight: bold;
}

#btn:hover{
  transform: scale(1.1);
  background: #fbfbfc;
}

.flotUp{
  position: fixed;
  border-radius: 50%;
  background: #12131b;
  animation: flotUp 10s linear infinite;

}

@keyframes flotUp {

  to   {transform: translateY(-120vh) scale(1.4); }
}

.flotDwon{

@keyframes flotDwon {

}


</style>
